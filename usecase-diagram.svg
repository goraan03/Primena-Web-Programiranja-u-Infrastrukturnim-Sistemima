<svg width="920" height="760" viewBox="0 0 920 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="760" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#5b21b6">Use Case dijagram — TravelPlanner</text>

  <!-- System boundary -->
  <rect x="240" y="70" width="620" height="640" rx="10" fill="#faf8ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="550" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">TravelPlanner Sistem</text>

  <!-- Korisnik actor -->
  <g stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="90" cy="220" r="16" fill="#ffffff"/>
    <line x1="90" y1="236" x2="90" y2="288"/>
    <line x1="60" y1="256" x2="120" y2="256"/>
    <line x1="90" y1="288" x2="62" y2="326"/>
    <line x1="90" y1="288" x2="118" y2="326"/>
  </g>
  <text x="90" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Korisnik</text>

  <!-- Admin actor -->
  <g stroke="#374151" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="90" cy="560" r="16" fill="#ffffff"/>
    <line x1="90" y1="576" x2="90" y2="628"/>
    <line x1="60" y1="596" x2="120" y2="596"/>
    <line x1="90" y1="628" x2="62" y2="666"/>
    <line x1="90" y1="628" x2="118" y2="666"/>
  </g>
  <text x="90" y="688" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Admin</text>

  <!-- Generalization: Admin --> Korisnik (hollow triangle, UML inheritance) -->
  <line x1="98" y1="544" x2="98" y2="382" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="98,368 90,384 106,384" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="465" font-size="11" fill="#6b7280" font-style="italic">nasleđuje (Admin je-vrsta-Korisnika)</text>

  <!-- Use case ellipse style -->
  <g font-size="12.5" fill="#111827">
    <!-- Korisnik use cases: single clean column -->
    <ellipse cx="440" cy="105" rx="95" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="109" text-anchor="middle">Registracija i prijava</text>

    <ellipse cx="440" cy="168" rx="105" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="172" text-anchor="middle">Upravljanje planom putovanja</text>

    <ellipse cx="440" cy="231" rx="105" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="235" text-anchor="middle">Upravljanje destinacijama</text>

    <ellipse cx="440" cy="294" rx="115" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="291" text-anchor="middle">Organizacija aktivnosti</text>
    <text x="440" y="304" text-anchor="middle" font-size="10.5" fill="#6b21a8">(sa kalendarskim prikazom)</text>

    <ellipse cx="440" cy="357" rx="110" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="361" text-anchor="middle">Evidencija troškova i budžeta</text>

    <ellipse cx="440" cy="420" rx="105" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="424" text-anchor="middle">Checklist / packing lista</text>

    <ellipse cx="440" cy="483" rx="105" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="487" text-anchor="middle">Deljenje plana (link / QR)</text>

    <ellipse cx="440" cy="546" rx="90" ry="27" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
    <text x="440" y="550" text-anchor="middle">Izvoz PDF izveštaja</text>

    <!-- Admin-only use cases, separate column further right, lower area -->
    <ellipse cx="700" cy="560" rx="110" ry="27" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="700" y="557" text-anchor="middle">Pregled i brisanje</text>
    <text x="700" y="570" text-anchor="middle">korisničkih naloga</text>

    <ellipse cx="700" cy="628" rx="110" ry="27" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="700" y="625" text-anchor="middle">Pregled svih planova</text>
    <text x="700" y="638" text-anchor="middle">putovanja u sistemu</text>
  </g>

  <!-- Korisnik associations - clean straight lines fanning right -->
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="118" y1="240" x2="345" y2="112"/>
    <line x1="118" y1="245" x2="335" y2="168"/>
    <line x1="118" y1="250" x2="335" y2="231"/>
    <line x1="118" y1="255" x2="325" y2="294"/>
    <line x1="118" y1="260" x2="330" y2="357"/>
    <line x1="118" y1="265" x2="335" y2="420"/>
    <line x1="118" y1="270" x2="335" y2="483"/>
    <line x1="118" y1="275" x2="350" y2="546"/>
  </g>

  <!-- Admin associations to admin-only use cases -->
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="118" y1="575" x2="590" y2="560"/>
    <line x1="118" y1="590" x2="590" y2="628"/>
  </g>

  <text x="550" y="700" text-anchor="middle" font-size="11.5" fill="#6b7280">Admin nasleđuje sve funkcionalnosti Korisnika (leva kolona) i dodatno ima svoje funkcionalnosti (desno, crveno).</text>
</svg>
